name: AppImage release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag to build
        required: true
        type: string
      resume_draft:
        description: Verify and publish already uploaded draft assets without replacing them
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - name: Verify immutable release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${tag#v}"
          test "$(sed -n 's/^version = "\([0-9][0-9.]*\)"$/\1/p' Cargo.toml | head -1)" = "$version"
          tag_ref="refs/tags/$tag"
          remote_tag="$(git ls-remote origin "$tag_ref" | awk -v ref="$tag_ref" '$2 == ref { print $1 }')"
          test -n "$remote_tag"
          git fetch --no-tags origin "$tag_ref"
          test "$(git cat-file -t "$remote_tag")" = tag
          test "$(git rev-parse "$remote_tag^{commit}")" = "$(git rev-parse HEAD)"
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          if gh release view "$tag" >/dev/null 2>&1; then
            if test "${{ inputs.resume_draft || false }}" != true || test "$(gh release view "$tag" --json isDraft --jq .isDraft)" != true; then
              echo 'Release already exists and is not an explicitly selected draft retry' >&2
              exit 1
            fi
          elif test "${{ inputs.resume_draft || false }}" = true; then
            echo 'Draft retry requested but no release exists' >&2
            exit 1
          fi
          printf 'RELEASE_TAG=%s\nAPP_DEPOT_SOURCE_REVISION=%s\n' "$tag" "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libgl1-mesa-dev libegl1-mesa-dev desktop-file-utils appstream zsync
      - name: Pin Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt,clippy && rustup default 1.100.0
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Build official AppImage
        env:
          APP_DEPOT_OFFICIAL_RELEASE: '1'
        run: |
          cargo build --release -p app-depot-desktop -p app-depot-update-helper --locked
          bash scripts/build-appimage.sh
          image="dist/AppDepot-${RELEASE_TAG#v}-x86_64.AppImage"
          (cd dist && sha256sum -c "$(basename "$image").sha256")
          "$image" --appimage-extract-and-run --version | grep -F "App Depot Desktop ${RELEASE_TAG#v} (official, $APP_DEPOT_SOURCE_REVISION)"
          "$image" --appimage-updateinformation | grep -F 'gh-releases-zsync|viktorliho|app-depot-client|latest|AppDepot-*-x86_64.AppImage.zsync'
          test -s "$image.zsync"
          desktop-file-validate assets/io.github.viktorliho.AppDepot.desktop
          appstreamcli validate assets/io.github.viktorliho.AppDepot.appdata.xml
          for size in 256 128 64 48 32; do test -s "target/AppDepot.AppDir/usr/share/icons/hicolor/${size}x${size}/apps/io.github.viktorliho.AppDepot.png"; done
      - name: Create draft, upload, verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          image="dist/AppDepot-${tag#v}-x86_64.AppImage"
          notes="docs/release-notes/$tag.md"
          test -f "$notes"
          if test "${{ inputs.resume_draft || false }}" = true; then
            release_dir="$(mktemp -d)"
            gh release download "$tag" --dir "$release_dir"
          else
            gh release create "$tag" --verify-tag --draft --title "App Depot Client $tag" --notes-file "$notes"
            gh release upload "$tag" "$image" "$image.sha256" "$image.zsync"
            release_dir=dist
          fi
          image_name="$(basename "$image")"
          test "$(gh release view "$tag" --json assets --jq '.assets | length')" = 3
          for asset_name in "$image_name" "$image_name.sha256" "$image_name.zsync"; do
            test "$(gh release view "$tag" --json assets --jq '.assets[] | select(.name == "'"$asset_name"'") | .name')" = "$asset_name"
          done
          (cd "$release_dir" && sha256sum -c "$image_name.sha256")
          expected="$(cut -d ' ' -f1 "$release_dir/$image_name.sha256")"
          for asset_name in "$image_name" "$image_name.sha256" "$image_name.zsync"; do
            observed="$(gh release view "$tag" --json assets --jq '.assets[] | select(.name == "'"$asset_name"'") | .digest')"
            test "$observed" = "sha256:$(sha256sum "$release_dir/$asset_name" | cut -d ' ' -f1)"
          done
          test "sha256:$expected" = "$(gh release view "$tag" --json assets --jq '.assets[] | select(.name == "'"$image_name"'") | .digest')"
          chmod +x "$release_dir/$image_name"
          "$release_dir/$image_name" --appimage-extract-and-run --version | grep -F "App Depot Desktop ${tag#v} (official, $APP_DEPOT_SOURCE_REVISION)"
          "$release_dir/$image_name" --appimage-updateinformation | grep -F 'gh-releases-zsync|viktorliho|app-depot-client|latest|AppDepot-*-x86_64.AppImage.zsync'
          gh release edit "$tag" --draft=false --prerelease=false
          gh release view "$tag" --json isDraft,isPrerelease --jq '(.isDraft == false) and (.isPrerelease == false)' | grep -Fx true
