name: Desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated Desktop release tag to build
        required: true
        type: string
      resume_draft:
        description: Resume an existing draft without replacing uploaded assets
        required: false
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      commit: ${{ steps.verify.outputs.commit }}
      tag_object: ${{ steps.verify.outputs.tag_object }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - id: verify
        name: Verify immutable release source
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(sed -n 's/^version = "\([0-9][0-9.]*\)"$/\1/p' Cargo.toml | head -1)" = "${tag#v}"
          ref="refs/tags/$tag"
          object="$(git ls-remote origin "$ref" | cut -f1)"
          test -n "$object"
          test "$(git rev-parse "$ref")" = "$object"
          test "$(git cat-file -t "$object")" = tag
          commit="$(git rev-parse "$object^{commit}")"
          test "$commit" = "$(git rev-parse HEAD)"
          git fetch origin main
          git merge-base --is-ancestor "$commit" origin/main
          test -f "docs/release-notes/$tag.md"
          printf 'tag=%s\ncommit=%s\ntag_object=%s\n' "$tag" "$commit" "$object" >> "$GITHUB_OUTPUT"

  linux:
    needs: source
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.source.outputs.tag }}
      APP_DEPOT_SOURCE_REVISION: ${{ needs.source.outputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.source.outputs.commit }}
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libgl1-mesa-dev libegl1-mesa-dev desktop-file-utils appstream zsync
      - name: Pin Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt,clippy && rustup default 1.100.0
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Build official AppImage
        env:
          APP_DEPOT_OFFICIAL_RELEASE: '1'
        run: |
          cargo build --release -p app-depot-desktop -p app-depot-update-helper --locked
          bash scripts/build-appimage.sh
          image="dist/AppDepot-${RELEASE_TAG#v}-x86_64.AppImage"
          (cd dist && sha256sum -c "$(basename "$image").sha256")
          "$image" --appimage-extract-and-run --version | grep -F "App Depot Desktop ${RELEASE_TAG#v} (official, $APP_DEPOT_SOURCE_REVISION)"
          "$image" --appimage-updateinformation | grep -F 'gh-releases-zsync|viktorliho|app-depot-client|latest|AppDepot-*-x86_64.AppImage.zsync'
          test -s "$image.zsync"
          desktop-file-validate assets/io.github.viktorliho.AppDepot.desktop
          appstreamcli validate assets/io.github.viktorliho.AppDepot.appdata.xml
          for size in 256 128 64 48 32; do test -s "target/AppDepot.AppDir/usr/share/icons/hicolor/${size}x${size}/apps/io.github.viktorliho.AppDepot.png"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-linux
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.AppImage.sha256
            dist/*.AppImage.zsync

  windows:
    needs: source
    runs-on: windows-2025
    env:
      APP_DEPOT_SOURCE_REVISION: ${{ needs.source.outputs.commit }}
      APP_DEPOT_OFFICIAL_RELEASE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.source.outputs.commit }}
      - run: ./scripts/test-windows-setup-config.ps1
      - run: rustup toolchain install 1.100.0-x86_64-pc-windows-msvc --profile minimal --component rustfmt,clippy
      - run: cargo +1.100.0 fmt --check
      - run: cargo +1.100.0 check --workspace --target x86_64-pc-windows-msvc --locked
      - run: cargo +1.100.0 clippy --workspace --all-targets --target x86_64-pc-windows-msvc --locked -- -D warnings
      - run: cargo +1.100.0 test --workspace --target x86_64-pc-windows-msvc --locked
      - name: Build official Inno Setup installer
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          powershell -NoProfile -ExecutionPolicy RemoteSigned -File scripts\build-windows.ps1 -Stable -OutputDirectory "%RUNNER_TEMP%\app-depot-desktop-release"
      - run: ./scripts/test-windows-installer.ps1 -SetupOnlyManifest -PackageDirectory "$env:RUNNER_TEMP/app-depot-desktop-release"
      - name: Check official Windows build version and source revision
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'app-depot-desktop-release/app-depot-desktop.exe'
          $version = $env:RELEASE_TAG.Substring(1)
          $expected = "App Depot Desktop $version (official, $env:APP_DEPOT_SOURCE_REVISION)"
          $actual = (& $exe --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $expected) { throw "Unexpected Windows build identity: $actual" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-windows
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/app-depot-desktop-release/AppDepot-Desktop-Windows-x64-Setup.exe
            ${{ runner.temp }}/app-depot-desktop-release/SHA256SUMS

  draft:
    needs: [source, linux, windows]
    runs-on: ubuntu-24.04
    concurrency:
      group: desktop-stable-publication
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Stage and verify the complete Desktop draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          RELEASE_TAG_OBJECT: ${{ needs.source.outputs.tag_object }}
          APP_DEPOT_SOURCE_REVISION: ${{ needs.source.outputs.commit }}
          RESUME_DRAFT: ${{ inputs.resume_draft || false }}
        run: bash scripts/publish-desktop-release.sh release-assets
