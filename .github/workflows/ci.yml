name: Client CI
on:
  push:
    branches: [main, 'feature/**', m5.3b-windows-executor]
  pull_request:
  workflow_dispatch:
    inputs:
      windows_10_smoke:
        description: Run installer smoke test on the disposable Windows 10 workstation runner
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: bash scripts/test-desktop-publish.sh
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libgl1-mesa-dev libegl1-mesa-dev desktop-file-utils appstream zsync
      - name: Pin Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt,clippy && rustup default 1.100.0
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release -p app-depot-desktop -p app-depot-update-helper --locked
      - name: Check release packaging
        run: |
          bash scripts/build-appimage.sh
          version="$(sed -n 's/^version = "\([0-9][0-9.]*\)"$/\1/p' Cargo.toml | head -1)"
          image="dist/AppDepot-${version}-x86_64.AppImage"
          test -x "$image"
          test -s "$image.zsync"
          (cd dist && sha256sum -c "$(basename "$image").sha256")
          "$image" --appimage-extract-and-run --version | grep -F 'development'
          desktop-file-validate assets/io.github.viktorliho.AppDepot.desktop
          appstreamcli validate assets/io.github.viktorliho.AppDepot.appdata.xml
          for size in 256 128 64 48 32; do test -s "target/AppDepot.AppDir/usr/share/icons/hicolor/${size}x${size}/apps/io.github.viktorliho.AppDepot.png"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AppDepot-Desktop-Linux-x64-RC
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.AppImage.sha256
            dist/*.AppImage.zsync

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check Windows setup version and architecture
        shell: pwsh
        run: ./scripts/test-windows-setup-config.ps1
      - name: Pin Rust MSVC toolchain
        run: rustup toolchain install 1.100.0-x86_64-pc-windows-msvc --profile minimal --component rustfmt,clippy
      - run: cargo +1.100.0 fmt --check
      - run: cargo +1.100.0 check --workspace --target x86_64-pc-windows-msvc --locked
      - run: cargo +1.100.0 clippy --workspace --all-targets --target x86_64-pc-windows-msvc --locked -- -D warnings
      - run: cargo +1.100.0 test --workspace --target x86_64-pc-windows-msvc --locked
      - run: cargo +1.100.0 build -p app-depot-desktop --bin app-depot-desktop --target x86_64-pc-windows-msvc --locked
      - name: Build Windows release candidate installer
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          powershell -NoProfile -ExecutionPolicy RemoteSigned -File scripts\build-windows.ps1 -Stable -OutputDirectory "%RUNNER_TEMP%\app-depot-windows-rc"
      - name: Verify Windows installer and update
        shell: pwsh
        run: |
          ./scripts/test-windows-installer.ps1 -SetupOnlyManifest -PackageDirectory "$env:RUNNER_TEMP/app-depot-windows-rc"
      - name: Upload unsigned Windows candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AppDepot-Desktop-Windows-x64-RC
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/app-depot-windows-rc/AppDepot-Desktop-Windows-x64-Setup.exe
            ${{ runner.temp }}/app-depot-windows-rc/app-depot-desktop.exe
            ${{ runner.temp }}/app-depot-windows-rc/SHA256SUMS

      - name: Build isolated Windows update fixtures
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          powershell -NoProfile -ExecutionPolicy RemoteSigned -File scripts\build-windows-update-fixture.ps1 -OutputDirectory "%RUNNER_TEMP%\app-depot-update-fixtures"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AppDepot-Windows-Update-Fixtures
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/app-depot-update-fixtures/*/AppDepot-Desktop-Windows-x64-Setup.exe
            ${{ runner.temp }}/app-depot-update-fixtures/*/SHA256SUMS
            ${{ runner.temp }}/app-depot-update-fixtures/B/latest.json

  windows-10-installer:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.windows_10_smoke
    needs: windows
    runs-on: [self-hosted, Windows, X64, app-depot-windows-10]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: AppDepot-Desktop-Windows-x64-RC
          path: ${{ runner.temp }}/app-depot-windows-rc
      - name: Verify Windows 10 per-user installer
        shell: powershell
        run: |
          ./scripts/test-windows-installer.ps1 -PackageDirectory "$env:RUNNER_TEMP/app-depot-windows-rc" -RequireWindows10 -SetupOnlyManifest
