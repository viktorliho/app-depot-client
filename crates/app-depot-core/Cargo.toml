[package]
name = "app-depot-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
mdns-sd = { version = "0.22.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
ureq = { version = "2.12", default-features = false, features = ["tls"] }
url = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
directories = "6"
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust", "windows-native", "apple-native"] }
sha2 = "0.10"
fs2 = "0.4"
unicode-normalization = "0.1"
unicode-casefold = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
