[package]
name = "app-depot-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
app-depot-core = { path = "../app-depot-core" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "clipboard"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11"] }

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu_no_default_features"] }
wgpu = { version = "30", default-features = false, features = ["dx12"] }

[target.'cfg(target_os = "linux")'.dependencies]
sha2 = "0.10"
url = "2"
fs2 = "0.4"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
